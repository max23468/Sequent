services:
  sequent:
    image: ${SEQUENT_IMAGE:?Immagine Sequent identificata per digest obbligatoria}
    restart: unless-stopped
    init: true
    read_only: true
    user: ${SEQUENT_RUNTIME_UID:?UID runtime obbligatorio}:${SEQUENT_RUNTIME_GID:?GID runtime obbligatorio}
    tmpfs:
      - /tmp:size=256m,mode=1770,uid=${SEQUENT_RUNTIME_UID:?UID runtime obbligatorio},gid=${SEQUENT_RUNTIME_GID:?GID runtime obbligatorio}
    environment:
      NODE_ENV: production
      BODY_SIZE_LIMIT: 260M
      SEQUENT_DATA_DIR: /var/lib/sequent
      SEQUENT_CODEX_HOME: /var/lib/sequent/.codex
      SEQUENT_CODEX_MODEL: gpt-5.6-terra
      SEQUENT_SECURE_COOKIES: "true"
      ORIGIN: ${SEQUENT_ORIGIN:?Origine HTTPS pubblica obbligatoria}
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
    volumes:
      - /opt/sequent/data:/var/lib/sequent
    networks:
      - sequent
    ports:
      - 127.0.0.1:3300:3000
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    cap_drop:
      - ALL

networks:
  sequent:
    name: sequent
