name: Production
run-name: Production ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit completo di main da distribuire
        required: true
        type: string
      release_run:
        description: Run ID della candidata ARM64 qualificata
        required: true
        type: string

permissions:
  actions: read
  contents: write
  deployments: write

concurrency:
  group: sequent-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy immutabile e readback
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: Production
    steps:
      - name: Verifica identità della candidata
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          RELEASE_RUN: ${{ inputs.release_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN" =~ ^[0-9]+$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN")"
          test "$(jq -r .head_sha <<<"$run_json")" = "$CANDIDATE_COMMIT"
          test "$(jq -r .head_branch <<<"$run_json")" = main
          test "$(jq -r .event <<<"$run_json")" = workflow_dispatch
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .path <<<"$run_json")" = .github/workflows/release-candidate.yml

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sequent-release-${{ inputs.commit }}
          path: release-artifact
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}

      - name: Rilegge il manifest per commit e tree esatti
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_COMMIT"
          candidate_tree="$(git rev-parse "${CANDIDATE_COMMIT}^{tree}")"
          node scripts/github/release-artifact.mjs verify \
            --manifest release-artifact/release-manifest.json \
            --commit "$CANDIDATE_COMMIT" --tree "$candidate_tree"

      - name: Prepara il canale SSH effimero
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SEQUENT_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SEQUENT_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/sequent-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$RUNNER_TEMP/sequent-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" >"$RUNNER_TEMP/sequent-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/sequent-ssh/key" "$RUNNER_TEMP/sequent-ssh/known_hosts"

      - name: Distribuisce, verifica e registra il deployment
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          GHCR_USERNAME: ${{ secrets.SEQUENT_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.SEQUENT_GHCR_TOKEN }}
          SSH_HOST: ${{ secrets.SEQUENT_SSH_HOST }}
          SSH_USER: ${{ secrets.SEQUENT_SSH_USER }}
          SEQUENT_ORIGIN: ${{ secrets.SEQUENT_ORIGIN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]]
          ssh_options=(-i "$RUNNER_TEMP/sequent-ssh/key" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/sequent-ssh/known_hosts" -o StrictHostKeyChecking=yes)
          incoming="/opt/sequent/tmp/incoming-$CANDIDATE_COMMIT-$GITHUB_RUN_ID"
          docker_config="/run/sequent-ghcr-$CANDIDATE_COMMIT-$GITHUB_RUN_ID"
          deployment_id=
          deployment_status() {
            local state="$1"
            [[ -n "$deployment_id" ]] || return 0
            jq -n --arg state "$state" --arg url "$SEQUENT_ORIGIN" \
              '{state: $state, environment: "Production", environment_url: $url, auto_inactive: false}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --input - >/dev/null
          }
          failed() { status=$?; deployment_status failure || true; exit "$status"; }
          trap failed ERR

          deployment_id="$(jq -n --arg ref "$CANDIDATE_COMMIT" \
            '{ref: $ref, environment: "Production", task: "sequent-production", auto_merge: false, required_contexts: []}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
          [[ "$deployment_id" =~ ^[0-9]+$ ]]
          printf '%s\n' "$deployment_id" >"$RUNNER_TEMP/sequent-deployment-id"
          chmod 0600 "$RUNNER_TEMP/sequent-deployment-id"
          deployment_status in_progress

          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "set -eu; cd /opt/sequent/repo; git diff --quiet; git diff --cached --quiet; git fetch origin main; git checkout main; git merge --ff-only origin/main; test \"\$(git rev-parse HEAD)\" = '$CANDIDATE_COMMIT'; install -d -m 0700 '$incoming'; sudo /usr/bin/install -d -o root -g root -m 0700 '$docker_config'"
          # Le espansioni client sono valori validati; il token passa solo su stdin.
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "sudo /usr/bin/env DOCKER_CONFIG='$docker_config' /usr/bin/docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin >/dev/null"
          scp "${ssh_options[@]}" release-artifact/release-manifest.json scripts/vps/run-trusted-deploy.sh \
            "$SSH_USER@$SSH_HOST:$incoming/"
          manifest_sha256="$(sha256sum release-artifact/release-manifest.json | cut -d' ' -f1)"
          launcher_sha256="$(sha256sum scripts/vps/run-trusted-deploy.sh | cut -d' ' -f1)"
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ && "$launcher_sha256" =~ ^[0-9a-f]{64}$ ]]
          image_ref="$(jq -r .reference release-artifact/release-manifest.json)"
          [[ "$image_ref" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          trusted_launcher="/run/sequent-run-trusted-deploy-$CANDIDATE_COMMIT"
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
            "test \"\$(stat -c '%U:%G:%a' /usr/local/sbin)\" = root:root:755 && sudo /usr/bin/install -o root -g root -m 0600 '$incoming/run-trusted-deploy.sh' '$trusted_launcher' && printf '%s  %s\\n' '$launcher_sha256' '$trusted_launcher' | sudo /usr/bin/sha256sum --check --strict && sudo /usr/bin/install -o root -g root -m 0755 '$trusted_launcher' /usr/local/sbin/sequent-run-trusted-deploy && sudo /usr/local/sbin/sequent-run-trusted-deploy --commit '$CANDIDATE_COMMIT' --image-ref '$image_ref' --docker-config '$docker_config' --manifest '$incoming/release-manifest.json' --manifest-sha256 '$manifest_sha256' && sudo /usr/bin/rm -- '$trusted_launcher'"

          deployment_status success
          trap - ERR

      - name: Crea e rilegge tag e GitHub Release
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github/release.mjs --commit "$CANDIDATE_COMMIT"

      - name: Finalizza il tentativo di deployment
        if: always()
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          JOB_STATUS: ${{ job.status }}
          SSH_HOST: ${{ secrets.SEQUENT_SSH_HOST }}
          SSH_USER: ${{ secrets.SEQUENT_SSH_USER }}
          SEQUENT_ORIGIN: ${{ secrets.SEQUENT_ORIGIN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment_file="$RUNNER_TEMP/sequent-deployment-id"
          if [[ -f "$deployment_file" && ! -L "$deployment_file" ]]; then
            deployment_id="$(<"$deployment_file")"
            if [[ "$deployment_id" =~ ^[0-9]+$ ]]; then
              if latest_state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                --jq '.[0].state // ""')"; then
                case "$latest_state" in
                  success|failure|error|inactive) ;;
                  *)
                    if ! jq -n --arg url "$SEQUENT_ORIGIN" \
                      '{state: "failure", environment: "Production", environment_url: $url, auto_inactive: false}' |
                      gh api --method POST \
                        "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                        --input - >/dev/null; then
                      echo "::warning title=Deployment non riconciliato::Impossibile chiudere il deployment $deployment_id"
                    fi
                    ;;
                esac
              else
                echo "::warning title=Deployment non riconciliato::Impossibile leggere il deployment $deployment_id"
              fi
            else
              echo "::warning title=Deployment non riconciliato::Identificativo persistito non valido"
            fi
          fi

          if [[ -f "$RUNNER_TEMP/sequent-ssh/key" ]]; then
            # shellcheck disable=SC2029
            ssh -i "$RUNNER_TEMP/sequent-ssh/key" -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/sequent-ssh/known_hosts" -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              "incoming='/opt/sequent/tmp/incoming-$CANDIDATE_COMMIT-$GITHUB_RUN_ID'; docker_config='/run/sequent-ghcr-$CANDIDATE_COMMIT-$GITHUB_RUN_ID'; case \"\$incoming\" in /opt/sequent/tmp/incoming-*) rm -rf --one-file-system \"\$incoming\" ;; *) exit 1 ;; esac; sudo /usr/bin/rm -rf --one-file-system \"\$docker_config\"; sudo /usr/bin/rm -f -- '/run/sequent-run-trusted-deploy-$CANDIDATE_COMMIT'" || true

            if [[ "$JOB_STATUS" == cancelled ]]; then
              cleanup_complete=false
              for attempt in {1..12}; do
                if ssh -i "$RUNNER_TEMP/sequent-ssh/key" -o IdentitiesOnly=yes \
                  -o UserKnownHostsFile="$RUNNER_TEMP/sequent-ssh/known_hosts" \
                  -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
                  "test \"\$(stat -c '%U:%G:%a' /usr/local/sbin/sequent-prune-docker-images)\" = root:root:755 && sudo /usr/local/sbin/sequent-prune-docker-images --minimum-age-hours 0 --dangling-age-hours 0"; then
                  cleanup_complete=true
                  break
                fi
                ((attempt == 12)) || sleep 5
              done
              if [[ "$cleanup_complete" != true ]]; then
                echo "::warning title=Pulizia dopo annullamento differita::Il timer di manutenzione ritenterà la pulizia selettiva sulla VPS"
              fi
            fi
          fi
          rm -f "$deployment_file"
          rm -rf "$RUNNER_TEMP/sequent-ssh"
