name: Release candidate
run-name: Release candidate ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit completo di main da qualificare
        required: true
        type: string

permissions:
  contents: read
  packages: write
  pull-requests: read
  statuses: read

concurrency:
  group: release-candidate-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualifica candidata e riusa i gate PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.identity.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse origin/main)" = "$CANDIDATE_COMMIT"
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Verifica albero e gate dell'HEAD approvato
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github/release-review.mjs --commit "$CANDIDATE_COMMIT"

  benchmark:
    name: Benchmark sicurezza estrazione
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run benchmark:extraction-safety -- --dataset tests/fixtures/extraction-safety-benchmark.synthetic.json

  scan-dependencies:
    name: Scansione dipendenze release
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Blocca vulnerabilità correggibili nel lockfile
        run: |
          scan_status=0
          docker run --rm --volume "$PWD:/src:ro" --workdir /src \
            ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 \
            scan source --format vertical --lockfile package-lock.json \
            > dependency-vulnerability-report.txt || scan_status=$?
          test "$scan_status" -eq 0 || test "$scan_status" -eq 1
          node scripts/github/osv-vulnerability-gate.mjs dependency-vulnerability-report.txt

  browser-suite:
    name: Browser release (${{ matrix.browser }})
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --project "${{ matrix.browser }}"

  build-arm64:
    name: Costruisce, scansiona e pubblica ARM64
    needs: qualify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Costruisce e prova l'immagine candidata
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="$repository:$CANDIDATE_COMMIT"
          docker build --platform linux/arm64 --build-arg APP_COMMIT_SHA=${{ inputs.commit }} --tag "$IMAGE_TAG" .
          SEQUENT_IMAGE="$IMAGE_TAG" bash scripts/local/verify-docker-runtime.sh
          docker run --platform linux/arm64 --detach --name sequent-release-smoke \
            --read-only --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,size=64m,mode=1770,uid=10001,gid=10001 \
            --tmpfs /var/lib/sequent:rw,size=64m,mode=0700,uid=10001,gid=10001 \
            --env SEQUENT_DATA_DIR=/var/lib/sequent --publish 127.0.0.1:3300:3000 "$IMAGE_TAG"
          for _attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3300/api/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3300/api/health
          docker rm --force sequent-release-smoke
          docker save --output "$RUNNER_TEMP/sequent-release-arm64.tar" "$IMAGE_TAG"
          scan_status=0
          docker run --rm --volume "$RUNNER_TEMP:/scan:ro" \
            ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 \
            scan image --format vertical --archive /scan/sequent-release-arm64.tar \
            > image-vulnerability-report.txt || scan_status=$?
          test "$scan_status" -eq 0 || test "$scan_status" -eq 1
          node scripts/github/osv-vulnerability-gate.mjs image-vulnerability-report.txt
          rm "$RUNNER_TEMP/sequent-release-arm64.tar"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_TAG"
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")"
          [[ "$reference" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          node scripts/github/release-artifact.mjs create --reference "$reference" --output release-manifest.json
          docker image rm "$IMAGE_TAG" "$reference" >/dev/null 2>&1 || true
          node scripts/github/release-artifact.mjs verify --manifest release-manifest.json \
            --commit "$CANDIDATE_COMMIT" --tree "${{ needs.qualify.outputs.tree }}" --pull
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sequent-release-${{ inputs.commit }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 14

  release-candidate-gate:
    name: Release candidate gate
    if: always()
    needs: [qualify, benchmark, scan-dependencies, browser-suite, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Richiede tutta la matrice release
        run: |
          test '${{ needs.qualify.result }}' = success
          test '${{ needs.benchmark.result }}' = success
          test '${{ needs.scan-dependencies.result }}' = success
          test '${{ needs.browser-suite.result }}' = success
          test '${{ needs.build-arm64.result }}' = success
