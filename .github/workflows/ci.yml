name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run verify:public

  svelte-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run doctor

  browser-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  arm64-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Costruisce l'immagine ARM64 senza pubblicarla
        run: docker build --platform linux/arm64 --tag sequent:${{ github.sha }} .
      - name: Esegue la release identificata in un container isolato
        run: |
          docker run --platform linux/arm64 --detach --name sequent-m2-smoke \
            --read-only --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,size=64m,mode=1770,uid=10001,gid=10001 \
            --tmpfs /var/lib/sequent:rw,size=64m,mode=0700,uid=10001,gid=10001 \
            --env SEQUENT_DATA_DIR=/var/lib/sequent \
            --publish 127.0.0.1:3300:3000 \
            sequent:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3300/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs sequent-m2-smoke
          exit 1
      - name: Rimuove il container di smoke
        if: always()
        run: docker rm --force sequent-m2-smoke || true
