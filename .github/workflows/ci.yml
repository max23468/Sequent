name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classifica pubblicazione
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      level: ${{ steps.policy.outputs.level }}
      runtime: ${{ steps.policy.outputs.runtime }}
      arm64: ${{ steps.policy.outputs.arm64 }}
      browser: ${{ steps.policy.outputs.browser }}
      compliance: ${{ steps.policy.outputs.compliance }}
      diz: ${{ steps.policy.outputs.diz }}
      documents: ${{ steps.policy.outputs.documents }}
      persistence: ${{ steps.policy.outputs.persistence }}
      security: ${{ steps.policy.outputs.security }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: policy
        name: Classifica la diff con fallback conservativo
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/github/publication-policy.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  rapid-gates:
    name: Gate rapidi
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run verify:rapid

  public-gates:
    # Mantiene il contesto storico durante la PR che migra la ruleset a PR gate.
    name: public-gates
    if: needs.classify.outputs.level != 'rapid'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - name: Installa gli strumenti per gli allegati ufficiali
        run: sudo apt-get update && sudo apt-get install --yes ghostscript icc-profiles-free imagemagick poppler-utils qpdf
      - run: npm ci
      - run: npm run verify:application

  svelte-doctor:
    name: Svelte Doctor
    if: needs.classify.outputs.level != 'rapid'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run doctor

  browser-gates:
    name: Gate browser (${{ matrix.browser }})
    if: needs.classify.outputs.browser == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --project "${{ matrix.browser }}"

  arm64-image:
    name: Immagine ARM64
    if: needs.classify.outputs.arm64 == 'true'
    needs: classify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Costruisce l'immagine ARM64 senza pubblicarla
        run: |
          docker build --platform linux/arm64 \
            --build-arg APP_COMMIT_SHA=${{ github.sha }} \
            --tag sequent:${{ github.sha }} .
      - name: Esegue l'immagine in un container isolato
        run: |
          docker run --platform linux/arm64 --detach --name sequent-pr-smoke \
            --read-only --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,size=64m,mode=1770,uid=10001,gid=10001 \
            --tmpfs /var/lib/sequent:rw,size=64m,mode=0700,uid=10001,gid=10001 \
            --env SEQUENT_DATA_DIR=/var/lib/sequent \
            --publish 127.0.0.1:3300:3000 \
            sequent:${{ github.sha }}
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3300/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs sequent-pr-smoke
          exit 1
      - name: Rimuove il container di smoke
        if: always()
        run: docker rm --force sequent-pr-smoke || true

  official-sources:
    name: Fonti e catalogo ministeriale
    if: needs.classify.outputs.compliance == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - name: Installa i lettori delle fonti ufficiali
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils poppler-utils python3-lxml
      - run: npm ci
      - run: npm run verify:sources

  pr-gate:
    name: PR gate
    if: always()
    needs:
      [
        classify,
        rapid-gates,
        public-gates,
        svelte-doctor,
        browser-gates,
        arm64-image,
        official-sources,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verifica che tutti i gate pertinenti siano verdi
        env:
          PUBLICATION_LEVEL: ${{ needs.classify.outputs.level }}
          REQUIRE_ARM64: ${{ needs.classify.outputs.arm64 }}
          REQUIRE_BROWSER: ${{ needs.classify.outputs.browser }}
          REQUIRE_COMPLIANCE: ${{ needs.classify.outputs.compliance }}
          CLASSIFICATION_RESULT: ${{ needs.classify.result }}
          RAPID_RESULT: ${{ needs.rapid-gates.result }}
          PUBLIC_RESULT: ${{ needs.public-gates.result }}
          DOCTOR_RESULT: ${{ needs.svelte-doctor.result }}
          BROWSER_RESULT: ${{ needs.browser-gates.result }}
          ARM64_RESULT: ${{ needs.arm64-image.result }}
          COMPLIANCE_RESULT: ${{ needs.official-sources.result }}
        run: node scripts/github/pr-gate.mjs
