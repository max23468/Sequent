version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    commit-message:
      prefix: deps
    open-pull-requests-limit: 10
    groups:
      npm-non-major:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Rome
    commit-message:
      prefix: ci
    open-pull-requests-limit: 10
    groups:
      actions-updates:
        patterns: ["*"]
